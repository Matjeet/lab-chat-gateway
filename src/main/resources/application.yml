spring:
  application:
    name: chat-gateway

firebase:
  # El gateway es el UNICO punto del sistema que valida tokens de identidad (Authorization:
  # Bearer <idToken>) -- ver com.arquetipo.demo.common.auth. false desactiva por completo la
  # inicializacion del SDK (los tests lo hacen).
  enabled: ${FIREBASE_ENABLED:true}
  # Ruta a la clave de la cuenta de servicio (mismo proyecto de Firebase que usa chat-registro
  # para crear las cuentas). Vacio = credenciales por defecto del entorno (ADC).
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

app:
  cors:
    # Origenes permitidos para /api/**. Lista separada por comas, cada uno con esquema +
    # host + puerto y SIN barra final (p. ej. "https://chat.example.com,http://localhost:3000").
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  websocket:
    # Origenes permitidos para /ws/**. Variable independiente de CORS_ALLOWED_ORIGINS (el
    # handshake de WebSocket no pasa por CORS), mismo criterio que chat-conversacion.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.arquetipo.demo: DEBUG

# Direccion gRPC de cada microservicio al que el gateway enruta peticiones.
# Un microservicio nuevo añade su propia entrada aqui (ver docs/arquitectura-gateway.md).
servicios:
  registro:
    grpc-host: ${REGISTRO_GRPC_HOST:localhost}
    grpc-port: ${REGISTRO_GRPC_PORT:9090}
  conversacion:
    grpc-host: ${CONVERSACION_GRPC_HOST:localhost}
    grpc-port: ${CONVERSACION_GRPC_PORT:9091}
