spring:
  application:
    name: chat-registro

  # Instancia MySQL centralizada y COMPARTIDA por todos los microservicios.
  # Este servicio usa su propio esquema y su propio usuario (ver src/main/resources/db/bootstrap.sql).
  # Las credenciales se sobreescriben por variables de entorno en cada despliegue.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_registro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:chat_registro_svc}
    password: ${DB_PASSWORD:chat_registro_pw}

  jpa:
    open-in-view: false
    hibernate:
      # `update` mantiene el esquema al dia en desarrollo. Al adoptar Flyway/Liquibase,
      # pasar a `validate` y versionar el DDL en src/main/resources/db/migration.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.format_sql: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.arquetipo.demo: DEBUG
